<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe - Qualifa / Justifiqa Dashboard</title>
    <style>
        /* CSS Reset & Basic Wireframe Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: monospace; /* Menggunakan font standar sistem agar fokus pada struktur */
            color: #333;
        }

        body {
            background-color: #f5f5f5;
            padding: 20px;
        }

        .wf-container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: #fff;
            border: 2px solid #666;
            min-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        /* Generic Box Styling for Wireframe */
        .wf-box {
            border: 2px dashed #999;
            background-color: #eaeaea;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        /* Top Bar */
        .wf-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            border-bottom: 2px solid #666;
            background-color: #f9f9f9;
        }

        .wf-logo {
            width: 150px;
            height: 40px;
        }

        .wf-user-area {
            display: flex;
            gap: 15px;
        }

        .wf-icon-box {
            width: 40px;
            height: 40px;
            border-radius: 5px; /* Sedikit lengkung untuk membedakan dengan modul utama */
        }

        .wf-avatar-box {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }

        /* Main Content Area */
        .wf-main {
            padding: 40px 30px;
            flex-grow: 1;
        }

        /* Hero / Search Section */
        .wf-hero {
            margin-bottom: 40px;
        }

        .wf-hero-text {
            height: 30px;
            width: 40%;
            margin-bottom: 10px;
            background-color: #ccc;
            border: none;
        }
        
        .wf-hero-subtext {
            height: 20px;
            width: 60%;
            margin-bottom: 20px;
            background-color: #ddd;
            border: none;
        }

        .wf-search-bar {
            width: 100%;
            height: 60px;
            border-radius: 30px;
            font-size: 16px;
        }

        /* 3 Pillars Section */
        .wf-section-title {
            height: 25px;
            width: 200px;
            margin-bottom: 20px;
            background-color: #ccc;
            border: none;
        }

        .wf-pillars {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .wf-pillar-card {
            height: 200px;
            flex-direction: column;
            gap: 15px;
        }

        .wf-card-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
        }

        .wf-card-title {
            width: 80%;
            height: 20px;
            background-color: #999;
            border: none;
        }

        .wf-card-desc {
            width: 100%;
            height: 40px;
            background-color: #ccc;
            border: none;
        }

        /* Bottom Section (Schedule & Quick Actions) */
        .wf-bottom-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        .wf-schedule-box {
            height: 150px;
            flex-direction: row;
            justify-content: space-between;
            padding: 30px;
        }

        .wf-schedule-info {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .wf-schedule-avatar {
            width: 80px;
            height: 80px;
            border-radius: 10px;
        }

        .wf-schedule-text-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .wf-schedule-line {
            width: 150px;
            height: 15px;
            background-color: #999;
            border: none;
        }
        
        .wf-schedule-line-2 {
            width: 100px;
            height: 15px;
            background-color: #ccc;
            border: none;
        }

        .wf-action-button {
            width: 120px;
            height: 45px;
            background-color: #666;
            color: #fff;
            border: none;
        }

        /* Quick Actions Stack */
        .wf-quick-actions {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .wf-quick-action-item {
            height: 70px;
            justify-content: flex-start;
            gap: 15px;
        }

        .wf-qa-icon {
            width: 40px;
            height: 40px;
            border-radius: 5px;
        }

        .wf-qa-text-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-start;
        }
        
        .wf-qa-title {
            width: 120px;
            height: 15px;
            background-color: #999;
            border: none;
        }
        
        .wf-qa-desc {
            width: 150px;
            height: 12px;
            background-color: #ccc;
            border: none;
        }

    </style>
</head>
<body>

    <div class="wf-container">
        <!-- Top Bar -->
        <div class="wf-header">
            <div class="wf-box wf-logo">[Logo Qualifa / Justifiqa]</div>
            <div class="wf-user-area">
                <div class="wf-box wf-icon-box">[Bel]</div>
                <div class="wf-box wf-avatar-box">[Img]</div>
            </div>
        </div>

        <div class="wf-main">
            <!-- Hero Section -->
            <div class="wf-hero">
                <div class="wf-box wf-hero-text"></div>
                <div class="wf-box wf-hero-subtext"></div>
                <div class="wf-box wf-search-bar">[Input Pencarian Utama]</div>
            </div>

            <!-- Pillars -->
            <div class="wf-box wf-section-title"></div>
            <div class="wf-pillars">
                <!-- Modul Medis -->
                <div class="wf-box wf-pillar-card">
                    <div class="wf-box wf-card-icon">[Ikon]</div>
                    <div class="wf-box wf-card-title"></div>
                    <div class="wf-box wf-card-desc"></div>
                    <div>Modul Medis</div>
                </div>
                <!-- Modul Hukum -->
                <div class="wf-box wf-pillar-card">
                    <div class="wf-box wf-card-icon">[Ikon]</div>
                    <div class="wf-box wf-card-title"></div>
                    <div class="wf-box wf-card-desc"></div>
                    <div>Modul Hukum</div>
                </div>
                <!-- Modul Psikologi -->
                <div class="wf-box wf-pillar-card">
                    <div class="wf-box wf-card-icon">[Ikon]</div>
                    <div class="wf-box wf-card-title"></div>
                    <div class="wf-box wf-card-desc"></div>
                    <div>Modul Psikologi</div>
                </div>
            </div>

            <!-- Bottom Section -->
            <div class="wf-bottom-layout">
                <div>
                    <div class="wf-box wf-section-title"></div>
                    <div class="wf-box wf-schedule-box">
                        <div class="wf-schedule-info">
                            <div class="wf-box wf-schedule-avatar">[Foto]</div>
                            <div class="wf-schedule-text-group">
                                <div class="wf-box wf-schedule-line"></div>
                                <div class="wf-box wf-schedule-line-2"></div>
                                <div class="wf-box wf-schedule-line-2"></div>
                            </div>
                        </div>
                        <div class="wf-box wf-action-button">[Button]</div>
                    </div>
                </div>
                
                <div>
                    <div class="wf-box wf-section-title"></div>
                    <div class="wf-quick-actions">
                        <div class="wf-box wf-quick-action-item">
                            <div class="wf-box wf-qa-icon">[Ikon]</div>
                            <div class="wf-qa-text-group">
                                <div class="wf-box wf-qa-title"></div>
                                <div class="wf-box wf-qa-desc"></div>
                            </div>
                        </div>
                        <div class="wf-box wf-quick-action-item">
                            <div class="wf-box wf-qa-icon">[Ikon]</div>
                            <div class="wf-qa-text-group">
                                <div class="wf-box wf-qa-title"></div>
                                <div class="wf-box wf-qa-desc"></div>
                            </div>
                        </div>
                        <div class="wf-box wf-quick-action-item">
                            <div class="wf-box wf-qa-icon">[Ikon]</div>
                            <div class="wf-qa-text-group">
                                <div class="wf-box wf-qa-title"></div>
                                <div class="wf-box wf-qa-desc"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
