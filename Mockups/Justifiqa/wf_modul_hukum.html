<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Wireframe - Modul Hukum</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: monospace; color: #333; }
        body { background-color: #f5f5f5; padding: 20px; display: flex; justify-content: center; }
        .wf-container { width: 1000px; background-color: #fff; border: 2px solid #666; display: flex; flex-direction: column; min-height: 80vh; }
        .wf-box { border: 2px dashed #999; background-color: #eaeaea; display: flex; align-items: center; justify-content: center; text-align: center; }
        
        .wf-header { padding: 20px; border-bottom: 2px solid #666; display: flex; align-items: center; justify-content: center; }
        .wf-title { height: 30px; width: 300px; }
        
        .wf-content { display: flex; padding: 30px; gap: 30px; }
        
        /* Left: Legal Drafting */
        .wf-left { flex: 1; display: flex; flex-direction: column; gap: 20px; }
        .wf-section { border: 2px solid #666; padding: 20px; }
        .wf-sec-title { width: 250px; height: 20px; margin-bottom: 20px; }
        
        .wf-template-card { border: 2px dashed #999; padding: 15px; margin-bottom: 15px; display: flex; align-items: center; gap: 15px; }
        .wf-doc-icon { width: 40px; height: 40px; }
        .wf-text-group { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .wf-line { width: 150px; height: 12px; background: #666; }
        .wf-line-sm { width: 100px; height: 12px; background: #ccc; }
        .wf-btn-dl { width: 40px; height: 40px; background: #999; color: white; }
        
        /* Right: Pro Bono */
        .wf-right { flex: 1; display: flex; flex-direction: column; gap: 20px; }
        
        .wf-form-group { margin-bottom: 15px; }
        .wf-label { width: 120px; height: 15px; background: #ccc; margin-bottom: 5px; }
        .wf-input { width: 100%; height: 35px; }
        .wf-textarea { width: 100%; height: 80px; }
        
        .wf-upload-area { height: 80px; margin-bottom: 15px; flex-direction: column; gap: 5px; }
        .wf-btn-submit { width: 100%; height: 45px; background: #666; color: white; }
    </style>
</head>
<body>
    <div class="wf-container">
        <div class="wf-header">
            <div class="wf-box wf-title">[Pusat Layanan Hukum & Advokasi]</div>
        </div>
        
        <div class="wf-content">
            <!-- Left: Legal Drafting -->
            <div class="wf-left">
                <div class="wf-section">
                    <div class="wf-box wf-sec-title">[Template Legal Drafting (UC-Huk02)]</div>
                    
                    <div class="wf-template-card">
                        <div class="wf-box wf-doc-icon">[DOC]</div>
                        <div class="wf-text-group">
                            <div class="wf-line"></div>
                            <div class="wf-line-sm"></div>
                        </div>
                        <button class="wf-box wf-btn-dl">[\/]</button>
                    </div>
                    
                    <div class="wf-template-card">
                        <div class="wf-box wf-doc-icon">[DOC]</div>
                        <div class="wf-text-group">
                            <div class="wf-line" style="width: 180px;"></div>
                            <div class="wf-line-sm"></div>
                        </div>
                        <button class="wf-box wf-btn-dl">[\/]</button>
                    </div>
                </div>
            </div>
            
            <!-- Right: Pro Bono -->
            <div class="wf-right">
                <div class="wf-section">
                    <div class="wf-box wf-sec-title">[Pengajuan Pro Bono (UC-Huk03)]</div>
                    <div style="margin-bottom: 15px;">[Formulir Bantuan Hukum Gratis SKTM]</div>
                    
                    <div class="wf-form-group">
                        <div class="wf-box wf-label"></div>
                        <div class="wf-box wf-input"></div>
                    </div>
                    
                    <div class="wf-form-group">
                        <div class="wf-box wf-label"></div>
                        <div class="wf-box wf-textarea"></div>
                    </div>
                    
                    <div class="wf-box wf-upload-area">
                        <div>[Ikon Upload]</div>
                        <div>[Upload Surat Keterangan Tidak Mampu (SKTM)]</div>
                    </div>
                    
                    <button class="wf-box wf-btn-submit">[Ajukan Permohonan Pro Bono]</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
