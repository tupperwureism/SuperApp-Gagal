<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Wireframe - Chat Room</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: monospace; color: #333; }
        body { background-color: #f5f5f5; padding: 20px; display: flex; justify-content: center; }
        .wf-container { width: 1200px; height: 80vh; background-color: #fff; border: 2px solid #666; display: flex; }
        .wf-box { border: 2px dashed #999; background-color: #eaeaea; display: flex; align-items: center; justify-content: center; text-align: center; }
        
        /* Left Sidebar: Session Info */
        .wf-sidebar { width: 300px; border-right: 2px solid #666; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .wf-timer-box { height: 80px; flex-direction: column; gap: 10px; background-color: #ddd; }
        .wf-timer-text { font-size: 24px; font-weight: bold; }
        
        .wf-partner-info { display: flex; flex-direction: column; gap: 15px; align-items: center; padding-top: 20px; border-top: 2px dashed #999; }
        .wf-partner-avatar { width: 100px; height: 100px; border-radius: 50%; }
        .wf-line { width: 150px; height: 15px; background: #999; }
        .wf-line-sm { width: 100px; height: 12px; background: #ccc; }
        
        /* Right: Chat Area */
        .wf-chat-area { flex: 1; display: flex; flex-direction: column; }
        .wf-chat-header { height: 60px; border-bottom: 2px solid #666; display: flex; align-items: center; padding: 0 20px; gap: 15px; }
        
        .wf-chat-history { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; background-color: #f9f9f9; }
        
        /* Bubbles */
        .wf-bubble { max-width: 60%; padding: 15px; border: 2px solid #666; }
        .wf-bubble.partner { align-self: flex-start; background: #fff; border-radius: 0 20px 20px 20px; }
        .wf-bubble.user { align-self: flex-end; background: #ddd; border-radius: 20px 0 20px 20px; }
        
        .wf-doc-bubble { display: flex; align-items: center; gap: 15px; }
        .wf-doc-icon { width: 40px; height: 40px; }
        
        /* Chat Input */
        .wf-chat-input-area { height: 80px; border-top: 2px solid #666; display: flex; align-items: center; padding: 0 20px; gap: 15px; background: #fff; }
        .wf-upload-btn { width: 50px; height: 50px; }
        .wf-input-box { flex: 1; height: 50px; justify-content: flex-start; padding-left: 20px; }
        .wf-send-btn { width: 80px; height: 50px; background: #666; color: white; }
    </style>
</head>
<body>
    <div class="wf-container">
        
        <!-- Sidebar -->
        <div class="wf-sidebar">
            <div class="wf-box wf-timer-box">
                <div>Sisa Waktu Sesi</div>
                <div class="wf-timer-text">45:00</div>
            </div>
            
            <div class="wf-partner-info">
                <div class="wf-box wf-partner-avatar">[Foto]</div>
                <div class="wf-line"></div>
                <div class="wf-line-sm"></div>
                <div class="wf-box" style="padding: 10px; width: 100%;">[Status: Online]</div>
            </div>
            
            <button class="wf-box" style="margin-top: auto; height: 40px; background: #999; color: white;">[Akhiri Sesi]</button>
        </div>

        <!-- Chat Area -->
        <div class="wf-chat-area">
            <div class="wf-chat-header">
                <div class="wf-line" style="width: 200px;"></div>
                <div class="wf-box" style="margin-left: auto; padding: 5px 10px;">[Info Enkripsi E2EE]</div>
            </div>
            
            <div class="wf-chat-history">
                <div class="wf-box wf-bubble partner">
                    [Teks: Halo, saya Budi. Ada yang bisa saya bantu terkait masalah hukum Anda?]
                </div>
                
                <div class="wf-box wf-bubble user">
                    [Teks: Ya pak, saya ingin mengirimkan draft kontrak untuk direview.]
                </div>
                
                <!-- Encrypted Document Upload (Huk-UC01) -->
                <div class="wf-box wf-bubble user wf-doc-bubble">
                    <div class="wf-box wf-doc-icon">[PDF]</div>
                    <div>
                        <div class="wf-line" style="margin-bottom: 5px;"></div>
                        <div class="wf-line-sm"></div>
                    </div>
                </div>
            </div>
            
            <div class="wf-chat-input-area">
                <div class="wf-box wf-upload-btn" title="Unggah Berkas terenkripsi">[+]</div>
                <div class="wf-box wf-input-box">[Ketik pesan...]</div>
                <div class="wf-box wf-send-btn">[Kirim]</div>
            </div>
        </div>

    </div>
</body>
</html>
