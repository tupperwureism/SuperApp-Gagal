<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Wireframe - Dashboard Mitra</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: monospace; color: #333; }
        body { background-color: #f5f5f5; padding: 20px; display: flex; justify-content: center; }
        .wf-container { width: 1200px; height: 80vh; background-color: #fff; border: 2px solid #666; display: flex; }
        .wf-box { border: 2px dashed #999; background-color: #eaeaea; display: flex; align-items: center; justify-content: center; text-align: center; }
        
        /* Sidebar */
        .wf-sidebar { width: 300px; border-right: 2px solid #666; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .wf-profile-area { display: flex; flex-direction: column; align-items: center; gap: 15px; padding-bottom: 20px; border-bottom: 2px solid #666; }
        .wf-avatar { width: 80px; height: 80px; border-radius: 50%; }
        .wf-line { width: 150px; height: 15px; background: #999; }
        
        .wf-toggle-box { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border: 2px solid #666; }
        .wf-toggle-switch { width: 50px; height: 25px; border-radius: 12px; background: #ccc; border: 2px solid #999; position: relative; }
        .wf-toggle-knob { width: 20px; height: 20px; border-radius: 50%; background: #666; position: absolute; left: 2px; top: 0.5px; }
        
        .wf-nav-item { height: 40px; justify-content: flex-start; padding-left: 20px; }
        
        /* Main Area */
        .wf-main { flex: 1; padding: 30px; display: flex; flex-direction: column; gap: 30px; overflow-y: auto; }
        .wf-header-text { height: 30px; width: 300px; background: #ccc; border: none; }
        
        .wf-queue-section { border: 2px solid #666; padding: 20px; }
        .wf-section-title { width: 200px; height: 20px; margin-bottom: 20px; }
        
        .wf-queue-item { display: flex; align-items: center; justify-content: space-between; padding: 15px; border: 2px dashed #999; margin-bottom: 15px; }
        .wf-client-info { display: flex; align-items: center; gap: 15px; }
        .wf-client-avatar { width: 50px; height: 50px; }
        .wf-text-group { display: flex; flex-direction: column; gap: 8px; }
        .wf-btn-accept { width: 100px; height: 40px; background: #666; color: white; }
        
        .wf-history-section { border: 2px solid #666; padding: 20px; }
        .wf-history-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #ccc; }
        .wf-btn-notes { width: 120px; height: 30px; }
    </style>
</head>
<body>
    <div class="wf-container">
        <!-- Sidebar -->
        <div class="wf-sidebar">
            <div class="wf-profile-area">
                <div class="wf-box wf-avatar">[Img]</div>
                <div class="wf-line"></div>
                <div class="wf-line" style="width: 100px; background: #ccc;"></div>
            </div>
            
            <div class="wf-toggle-box">
                <div>Status: Online</div>
                <div class="wf-toggle-switch">
                    <div class="wf-toggle-knob"></div>
                </div>
            </div>
            
            <div class="wf-box wf-nav-item">[Icon] Dasbor Utama</div>
            <div class="wf-box wf-nav-item">[Icon] Riwayat Sesi</div>
            <div class="wf-box wf-nav-item">[Icon] Dompet Saldo</div>
        </div>
        
        <!-- Main Area -->
        <div class="wf-main">
            <div class="wf-box wf-header-text">[Selamat Bekerja, Dr. Andi]</div>
            
            <!-- Incoming Queue -->
            <div class="wf-queue-section">
                <div class="wf-box wf-section-title">[Antrean Konsultasi (2)]</div>
                
                <div class="wf-queue-item">
                    <div class="wf-client-info">
                        <div class="wf-box wf-client-avatar">[Img]</div>
                        <div class="wf-text-group">
                            <div class="wf-line"></div>
                            <div class="wf-line" style="width: 120px; background: #ccc;"></div>
                        </div>
                    </div>
                    <button class="wf-box wf-btn-accept">[TERIMA]</button>
                </div>
                
                <div class="wf-queue-item">
                    <div class="wf-client-info">
                        <div class="wf-box wf-client-avatar">[Img]</div>
                        <div class="wf-text-group">
                            <div class="wf-line"></div>
                            <div class="wf-line" style="width: 120px; background: #ccc;"></div>
                        </div>
                    </div>
                    <button class="wf-box wf-btn-accept">[TERIMA]</button>
                </div>
            </div>
            
            <!-- Recent History & Notes -->
            <div class="wf-history-section">
                <div class="wf-box wf-section-title" style="width: 250px;">[Sesi Selesai (Butuh Catatan)]</div>
                
                <div class="wf-history-item">
                    <div class="wf-text-group">
                        <div class="wf-line" style="width: 180px;"></div>
                        <div class="wf-line" style="width: 100px; background: #ccc;"></div>
                    </div>
                    <button class="wf-box wf-btn-notes">[Buat Catatan]</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
