<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Wireframe - Modul Psikologi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: monospace; color: #333; }
        body { background-color: #f5f5f5; padding: 20px; display: flex; justify-content: center; }
        .wf-container { width: 1000px; background-color: #fff; border: 2px solid #666; display: flex; flex-direction: column; min-height: 80vh; }
        .wf-box { border: 2px dashed #999; background-color: #eaeaea; display: flex; align-items: center; justify-content: center; text-align: center; }
        
        .wf-header { padding: 20px; border-bottom: 2px solid #666; display: flex; align-items: center; justify-content: center; }
        .wf-title { height: 30px; width: 350px; }
        
        .wf-content { display: flex; flex-direction: column; padding: 30px; gap: 30px; }
        
        /* DASS-21 */
        .wf-section { border: 2px solid #666; padding: 20px; }
        .wf-sec-title { width: 250px; height: 20px; margin-bottom: 20px; }
        
        .wf-question { margin-bottom: 15px; border-bottom: 1px dashed #ccc; padding-bottom: 15px; }
        .wf-q-text { width: 400px; height: 15px; background: #ccc; margin-bottom: 10px; }
        .wf-options { display: flex; gap: 15px; }
        .wf-option { display: flex; align-items: center; gap: 5px; }
        .wf-radio { width: 15px; height: 15px; border-radius: 50%; border: 2px solid #666; }
        
        .wf-btn-submit { width: 200px; height: 40px; background: #666; color: white; margin-top: 10px; }
        
        /* Mood Journal */
        .wf-emojis { display: flex; gap: 20px; margin-bottom: 20px; }
        .wf-emoji { width: 50px; height: 50px; border-radius: 50%; font-size: 30px; }
        
        .wf-textarea { width: 100%; height: 100px; border: 2px solid #666; margin-bottom: 15px; padding: 10px; }
    </style>
</head>
<body>
    <div class="wf-container">
        <div class="wf-header">
            <div class="wf-box wf-title">[Pusat Kesehatan Mental & Psikologi]</div>
        </div>
        
        <div class="wf-content">
            <!-- DASS-21 -->
            <div class="wf-section">
                <div class="wf-box wf-sec-title">[Asesmen DASS-21 (UC-Psi01)]</div>
                <div style="margin-bottom: 20px;">[Instruksi: Pilih skala yang paling sesuai dengan kondisi Anda minggu ini]</div>
                
                <div class="wf-question">
                    <div class="wf-q-text"></div>
                    <div class="wf-options">
                        <div class="wf-option"><div class="wf-radio"></div> 0</div>
                        <div class="wf-option"><div class="wf-radio"></div> 1</div>
                        <div class="wf-option"><div class="wf-radio"></div> 2</div>
                        <div class="wf-option"><div class="wf-radio"></div> 3</div>
                    </div>
                </div>
                
                <div class="wf-question">
                    <div class="wf-q-text" style="width: 300px;"></div>
                    <div class="wf-options">
                        <div class="wf-option"><div class="wf-radio"></div> 0</div>
                        <div class="wf-option"><div class="wf-radio"></div> 1</div>
                        <div class="wf-option"><div class="wf-radio"></div> 2</div>
                        <div class="wf-option"><div class="wf-radio"></div> 3</div>
                    </div>
                </div>
                
                <button class="wf-box wf-btn-submit">[Lihat Hasil Asesmen]</button>
            </div>
            
            <!-- Mood Journal -->
            <div class="wf-section">
                <div class="wf-box wf-sec-title">[Jurnal Mood Harian (UC-Psi02)]</div>
                
                <div style="margin-bottom: 15px;">[Bagaimana perasaan Anda hari ini?]</div>
                <div class="wf-emojis">
                    <div class="wf-box wf-emoji">😢</div>
                    <div class="wf-box wf-emoji">😐</div>
                    <div class="wf-box wf-emoji">🙂</div>
                    <div class="wf-box wf-emoji">😁</div>
                </div>
                
                <div class="wf-box wf-textarea">[Ceritakan lebih detail tentang hari Anda...]</div>
                
                <button class="wf-box wf-btn-submit" style="width: 150px;">[Simpan Jurnal]</button>
            </div>
        </div>
    </div>
</body>
</html>
