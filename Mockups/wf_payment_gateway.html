<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Wireframe - Payment</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: monospace; color: #333; }
        body { background-color: #f5f5f5; padding: 20px; display: flex; justify-content: center; }
        .wf-container { width: 1000px; background-color: #fff; border: 2px solid #666; display: flex; flex-direction: column; min-height: 80vh; }
        .wf-box { border: 2px dashed #999; background-color: #eaeaea; display: flex; align-items: center; justify-content: center; text-align: center; }
        
        .wf-header { padding: 20px; border-bottom: 2px solid #666; display: flex; align-items: center; gap: 20px; }
        .wf-back-btn { width: 50px; height: 30px; }
        .wf-title { height: 30px; width: 250px; }
        
        .wf-content { display: flex; padding: 30px; gap: 30px; flex-grow: 1; }
        
        /* Left: Order Details */
        .wf-order { flex: 1; border: 2px solid #666; padding: 20px; }
        .wf-order-title { width: 150px; height: 20px; margin-bottom: 20px; }
        
        .wf-order-item { display: flex; gap: 15px; margin-bottom: 20px; }
        .wf-avatar { width: 60px; height: 60px; }
        .wf-text-group { display: flex; flex-direction: column; gap: 10px; }
        .wf-line { width: 200px; height: 15px; background: #999; }
        .wf-line-sm { width: 120px; height: 15px; background: #ccc; }
        
        .wf-divider { height: 2px; background: #666; margin: 20px 0; }
        
        .wf-price-row { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .wf-price-box { width: 100px; height: 15px; background: #ccc; }
        .wf-total-row { display: flex; justify-content: space-between; margin-top: 20px; font-weight: bold; }
        .wf-total-box { width: 150px; height: 25px; background: #666; }
        
        /* Right: Payment Methods */
        .wf-payment { flex: 1.5; display: flex; flex-direction: column; gap: 15px; }
        
        .wf-method-group { border: 2px solid #666; padding: 20px; }
        .wf-method-title { width: 150px; height: 20px; margin-bottom: 15px; }
        
        .wf-method-option { height: 60px; margin-bottom: 10px; justify-content: flex-start; padding-left: 20px; gap: 15px; cursor: pointer; }
        .wf-radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #666; }
        .wf-method-logo { width: 60px; height: 30px; }
        .wf-method-name { width: 150px; height: 15px; background: #ccc; }
        
        .wf-pay-btn { width: 100%; height: 60px; background: #666; color: white; font-size: 18px; margin-top: auto; }
    </style>
</head>
<body>
    <div class="wf-container">
        <div class="wf-header">
            <div class="wf-box wf-back-btn">[<]</div>
            <div class="wf-box wf-title">[Teks: Selesaikan Pembayaran]</div>
        </div>
        
        <div class="wf-content">
            <!-- Left: Order Summary -->
            <div class="wf-order">
                <div class="wf-box wf-order-title">[Ringkasan Pesanan]</div>
                
                <div class="wf-order-item">
                    <div class="wf-box wf-avatar">[Img]</div>
                    <div class="wf-text-group">
                        <div class="wf-line"></div>
                        <div class="wf-line-sm"></div>
                    </div>
                </div>
                
                <div class="wf-divider"></div>
                
                <div class="wf-price-row">
                    <div>[Biaya Konsultasi]</div>
                    <div class="wf-box wf-price-box"></div>
                </div>
                <div class="wf-price-row">
                    <div>[Biaya Platform]</div>
                    <div class="wf-box wf-price-box"></div>
                </div>
                
                <div class="wf-divider"></div>
                
                <div class="wf-total-row">
                    <div>[Total Tagihan]</div>
                    <div class="wf-box wf-total-box"></div>
                </div>
            </div>
            
            <!-- Right: Payment Selection -->
            <div class="wf-payment">
                <div class="wf-method-group">
                    <div class="wf-box wf-method-title">[Dompet Digital]</div>
                    <div class="wf-box wf-method-option">
                        <div class="wf-radio"></div>
                        <div class="wf-box wf-method-logo">[Logo E-Wallet]</div>
                        <div class="wf-method-name"></div>
                    </div>
                    <div class="wf-box wf-method-option">
                        <div class="wf-radio"></div>
                        <div class="wf-box wf-method-logo">[Logo E-Wallet]</div>
                        <div class="wf-method-name"></div>
                    </div>
                </div>
                
                <div class="wf-method-group">
                    <div class="wf-box wf-method-title">[Virtual Account]</div>
                    <div class="wf-box wf-method-option">
                        <div class="wf-radio"></div>
                        <div class="wf-box wf-method-logo">[Logo Bank]</div>
                        <div class="wf-method-name"></div>
                    </div>
                </div>
                
                <button class="wf-box wf-pay-btn">[BAYAR SEKARANG]</button>
            </div>
        </div>
    </div>
</body>
</html>
