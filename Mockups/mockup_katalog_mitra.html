<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog & Pemilihan Mitra Profesional — LifeQ SuperApp (UC-03)</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background: #080c14; color: #f8fafc; min-height: 100vh; display: block; }
        
        .main-fullwidth {
            max-width: 1380px;
            margin: 0 auto;
            padding: 2.5rem 3.5rem;
            width: 100%;
        }
        .topbar-fullwidth {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .logo-superapp {
            font-size: 1.6rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        .logo-superapp span { color: #0ea5e9; }
        .notif-profile-group { display: flex; align-items: center; gap: 18px; }
        .btn-notif {
            width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1); color: #cbd5e1; display: flex;
            align-items: center; justify-content: center; text-decoration: none; font-size: 1.2rem; transition: all 0.2s;
        }
        .btn-notif:hover { background: rgba(255,255,255,0.1); border-color: #38bdf8; }
        .user-profile { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.03); padding: 6px 16px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.08); }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #0ea5e9, #3b82f6); display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; }

        /* Domain Header Tabs */
        .domain-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.8rem;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 1rem;
            overflow-x: auto;
        }
        .domain-tab {
            padding: 0.8rem 1.6rem;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.02);
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .domain-tab:hover {
            background: rgba(255,255,255,0.06);
            color: #fff;
        }
        .domain-tab.active-medis {
            background: linear-gradient(135deg, rgba(16,185,129,0.2), rgba(5,150,105,0.3));
            border-color: #10b981;
            color: #34d399;
            box-shadow: 0 0 20px rgba(16,185,129,0.2);
        }
        .domain-tab.active-hukum {
            background: linear-gradient(135deg, rgba(245,158,11,0.2), rgba(217,119,6,0.3));
            border-color: #f59e0b;
            color: #fbbf24;
            box-shadow: 0 0 20px rgba(245,158,11,0.2);
        }
        .domain-tab.active-psikologi {
            background: linear-gradient(135deg, rgba(168,85,247,0.2), rgba(126,34,206,0.3));
            border-color: #a855f7;
            color: #c084fc;
            box-shadow: 0 0 20px rgba(168,85,247,0.2);
        }

        /* Filter Section */
        .filter-section {
            background: rgba(17,24,39,0.7);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .specialization-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-bottom: 1.2rem;
        }
        .pill {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            background: rgba(255,255,255,0.05);
            color: #cbd5e1;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.2s;
        }
        .pill:hover, .pill.active {
            background: rgba(14,165,233,0.2);
            color: #38bdf8;
            border-color: #0ea5e9;
        }

        .filter-controls {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 1rem;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 1.2rem;
        }
        .search-input {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            padding: 0.75rem 1rem;
            color: #fff;
            font-size: 0.9rem;
        }
        .search-input:focus { outline: none; border-color: #0ea5e9; }
        
        .filter-select {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            padding: 0.75rem 1rem;
            color: #fff;
            font-size: 0.9rem;
            width: 100%;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 0.85rem;
            color: #cbd5e1;
            font-weight: 500;
        }
        .checkbox-item { display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .checkbox-item input { accent-color: #0ea5e9; width: 16px; height: 16px; }

        /* Grid Mitra Cards */
        .partner-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.8rem;
        }
        .partner-card {
            background: rgba(17,24,39,0.7);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 1.6rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .partner-card:hover {
            transform: translateY(-5px);
            border-color: rgba(14,165,233,0.4);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }
        .partner-header {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.2rem;
        }
        .partner-photo {
            width: 70px;
            height: 70px;
            border-radius: 14px;
            object-fit: cover;
            background: #1e293b;
            border: 2px solid rgba(255,255,255,0.1);
            flex-shrink: 0;
        }
        .partner-info h3 { font-size: 1.15rem; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 6px; }
        .partner-info .spec { font-size: 0.85rem; color: #38bdf8; font-weight: 600; margin-top: 3px; }
        .partner-info .license { font-size: 0.75rem; color: #64748b; margin-top: 4px; font-family: 'Roboto Mono', monospace; }
        
        .badge-verified { background: rgba(16,185,129,0.2); color: #34d399; font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: 700; }
        
        .status-badge {
            position: absolute;
            top: 1.2rem;
            right: 1.2rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-online { background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
        .status-busy { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.3); }
        .status-offline { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
        .dot { width: 8px; height: 8px; border-radius: 50%; }
        .dot-online { background: #10b981; box-shadow: 0 0 8px #10b981; }
        .dot-busy { background: #f59e0b; }
        .dot-offline { background: #ef4444; }

        .partner-stats {
            display: flex;
            justify-content: space-between;
            padding: 0.8rem 1rem;
            background: rgba(0,0,0,0.25);
            border-radius: 10px;
            margin-bottom: 1.2rem;
            font-size: 0.85rem;
        }
        .stat-item { text-align: center; }
        .stat-val { font-weight: 700; color: #fff; font-size: 0.95rem; }
        .stat-lbl { color: #64748b; font-size: 0.75rem; }

        .partner-price {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            border-top: 1px dashed rgba(255,255,255,0.1);
            padding-top: 1rem;
        }
        .price-label { font-size: 0.8rem; color: #94a3b8; }
        .price-amount { font-size: 1.2rem; font-weight: 800; color: #38bdf8; font-family: 'Roboto Mono', monospace; }

        .btn-action {
            width: 100%;
            padding: 0.85rem;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            text-align: center;
            text-decoration: none;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
        }
        .btn-pay-medis { background: linear-gradient(135deg, #10b981, #059669); color: #fff; box-shadow: 0 4px 12px rgba(16,185,129,0.3); }
        .btn-pay-hukum { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; box-shadow: 0 4px 12px rgba(245,158,11,0.3); }
        .btn-pay-psikologi { background: linear-gradient(135deg, #a855f7, #7e22ce); color: #fff; box-shadow: 0 4px 12px rgba(168,85,247,0.3); }
        .btn-action:hover { opacity: 0.9; transform: translateY(-1px); }

        .btn-secondary {
            background: rgba(255,255,255,0.05);
            color: #cbd5e1;
            border: 1px solid rgba(255,255,255,0.15);
            margin-top: 0.5rem;
            font-size: 0.8rem;
            padding: 0.6rem;
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); color: #fff; }

        /* Responsive */
        @media (max-width: 1024px) {
            .filter-controls { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 768px) {
            .main-fullwidth { padding: 1.5rem; }
            .filter-controls { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="main-fullwidth">
        <!-- Topbar -->
        <div class="topbar-fullwidth">
            <a href="mockup_dashboard_klien.html" class="logo-superapp">
                <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
                    <path d="M6 6H18C23.5228 6 28 10.4772 28 16C28 21.5228 23.5228 26 18 26H6V6Z" stroke="#0EA5E9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="16" cy="16" r="4" fill="#38BDF8"/>
                </svg>
                LifeQ <span>SuperApp</span>
            </a>
            <div style="font-size: 1.1rem; font-weight: 700; color: #e2e8f0;">🔍 Katalog & Pemilihan Mitra Profesional (UC-03)</div>
            <div class="notif-profile-group">
                <a href="mockup_dashboard_klien.html" class="btn-notif" title="Kembali ke Dasbor">🏠</a>
                <a href="#" class="btn-notif" title="Notifikasi">🔔</a>
                <div class="user-profile">
                    <div class="avatar">KD</div>
                    <div>
                        <div style="font-size: 0.85rem; font-weight: 700;">Klien Dewasa</div>
                        <div style="font-size: 0.7rem; color: #38bdf8;">Saldo: Rp 450.000</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Domain Selection Tabs -->
        <div class="domain-tabs">
            <div class="domain-tab active-medis" id="tab-medis" onclick="switchDomain('medis')">
                🩺 Sehatifiqa (Kesehatan Medis)
            </div>
            <div class="domain-tab" id="tab-hukum" onclick="switchDomain('hukum')">
                ⚖️ Justifiqa (Konsultasi Hukum)
            </div>
            <div class="domain-tab" id="tab-psikologi" onclick="switchDomain('psikologi')">
                🧠 Qualifa (Kesehatan Mental)
            </div>
        </div>

        <!-- Filter & Search Box -->
        <div class="filter-section">
            <!-- Specialization Pills -->
            <div class="specialization-pills" id="pills-container">
                <!-- Dynamic pills injected by JS -->
            </div>

            <!-- Search & Dropdowns -->
            <div class="filter-controls">
                <input type="text" class="search-input" placeholder="🔍 Cari nama mitra, STR/SIPP/Peradi, atau keahlian...">
                <select class="filter-select">
                    <option value="">💰 Semua Rentang Tarif</option>
                    <option value="low">< Rp 100.000 / sesi</option>
                    <option value="mid">Rp 100.000 - Rp 250.000</option>
                    <option value="high">> Rp 250.000 / sesi</option>
                    <option value="free">🎉 Subsidi / Pro Bono (Rp 0)</option>
                </select>
                <select class="filter-select">
                    <option value="">⭐️ Semua Rating</option>
                    <option value="4.8">⭐️ 4.8+ Terbaik</option>
                    <option value="4.5">⭐️ 4.5 ke atas</option>
                </select>
                <div class="checkbox-group">
                    <label class="checkbox-item">
                        <input type="checkbox" checked> 🟢 Hanya Online & Siap Konsul
                    </label>
                    <label class="checkbox-item" title="Sesuai spek ST-005 untuk janji temu tatap muka / darurat">
                        <input type="checkbox"> 📍 Radius < 10 km
                    </label>
                </div>
            </div>
        </div>

        <!-- Partner Grid Cards -->
        <div class="partner-grid" id="grid-container">
            <!-- Dynamic partner cards injected by JS -->
        </div>
    </div>

    <script>
        const domainData = {
            medis: {
                pills: ['Semua Dokter', 'Dokter Umum', 'Dokter Gigi', 'Spesialis Anak (Pediatri)', 'Spesialis Penyakit Dalam', 'Spesialis Jantung (Kardiologi)'],
                btnClass: 'btn-pay-medis',
                partners: [
                    { name: "dr. Andi Pratama, Sp.PD", spec: "Spesialis Penyakit Dalam", license: "STR: 31112024098871", exp: "8 Tahun", rating: "4.9", reviews: "142", status: "online", price: "Rp 150.000", photo: "👨‍⚕️" },
                    { name: "dr. Sinta Maharani", spec: "Dokter Umum & Keluarga", license: "STR: 31112023019923", exp: "5 Tahun", rating: "4.8", reviews: "320", status: "online", price: "Rp 65.000", photo: "👩‍⚕️" },
                    { name: "drg. Budi Santoso, Sp.KG", spec: "Dokter Gigi & Konservasi Gigi", license: "STR: 31112022048811", exp: "11 Tahun", rating: "4.9", reviews: "89", status: "busy", price: "Rp 200.000", photo: "👨‍⚕️" },
                    { name: "dr. Maya Lestari, Sp.A", spec: "Spesialis Anak (Pediatri)", license: "STR: 31112021087762", exp: "9 Tahun", rating: "5.0", reviews: "210", status: "online", price: "Rp 180.000", photo: "👩‍⚕️" },
                    { name: "dr. Hendra Gunawan, Sp.JP", spec: "Spesialis Jantung & Pembuluh Darah", license: "STR: 31112020056633", exp: "15 Tahun", rating: "4.9", reviews: "175", status: "offline", price: "Rp 250.000", photo: "👨‍⚕️" },
                    { name: "dr. Reni Anggraeni", spec: "Dokter Umum (Tele-Triage)", license: "STR: 31112024021199", exp: "3 Tahun", rating: "4.7", reviews: "94", status: "online", price: "Rp 50.000", photo: "👩‍⚕️" }
                ]
            },
            hukum: {
                pills: ['Semua Advokat & Notaris', 'Pengacara Pidana', 'Hukum Perdata & Keluarga', 'Konsultan Bisnis & PT', 'Notaris (CV/PT/PPAT)', 'Hukum Ketenagakerjaan', 'HAKI & Paten'],
                btnClass: 'btn-pay-hukum',
                partners: [
                    { name: "Rizky Ramadhan, S.H., M.H.", spec: "Pengacara Hukum Pidana & Tipikor", license: "Peradi: 09.11234 / SIPP Aktif", exp: "10 Tahun", rating: "4.9", reviews: "88", status: "online", price: "Rp 300.000", photo: "👨‍⚖️" },
                    { name: "Anisa Wardhani, S.H., M.Kn.", spec: "Notaris & Akta Tanah (PPAT/PT/CV)", license: "SK Kemenkumham No. AHU-123.AH.02", exp: "12 Tahun", rating: "5.0", reviews: "156", status: "online", price: "Rp 350.000", photo: "👩‍⚖️" },
                    { name: "David Halim, S.H.", spec: "Konsultan Hukum Bisnis & Ketenagakerjaan", license: "Peradi: 11.88765 / SIPP Aktif", exp: "7 Tahun", rating: "4.8", reviews: "112", status: "busy", price: "Rp 250.000", photo: "👨‍⚖️" },
                    { name: "Dewi Anggraini, S.H., M.H.", spec: "Hukum Perdata, Waris & Perceraian", license: "Peradi: 08.44321 / SIPP Aktif", exp: "14 Tahun", rating: "4.9", reviews: "204", status: "online", price: "Rp 280.000", photo: "👩‍⚖️" },
                    { name: "Bambang Pamungkas, S.H.", spec: "Layanan Bantuan Hukum (Pro Bono)", license: "LBH Keadilan / Peradi Terverifikasi", exp: "6 Tahun", rating: "4.8", reviews: "310", status: "online", price: "Rp 0 (Subsidi)", photo: "👨‍⚖️" },
                    { name: "Fanny Septiani, S.H., LL.M.", spec: "Hukum Kekayaan Intelektual (HAKI & Merek)", license: "Peradi: 14.99812 / SIPP Aktif", exp: "8 Tahun", rating: "4.9", reviews: "67", status: "offline", price: "Rp 320.000", photo: "👩‍⚖️" }
                ]
            },
            psikologi: {
                pills: ['Semua Psikolog', 'Psikolog Klinis Dewasa', 'Psikolog Anak & Remaja', 'Konselor Pernikahan', 'Terapi Trauma & PTSD', 'Manajemen Stres & Burnout'],
                btnClass: 'btn-pay-psikologi',
                partners: [
                    { name: "Nadia Safitri, M.Psi., Psikolog", spec: "Psikolog Klinis Dewasa & Kecemasan", license: "SIPP: 2023019981 / HIMPSI", exp: "8 Tahun", rating: "5.0", reviews: "245", status: "online", price: "Rp 200.000", photo: "🧠" },
                    { name: "dr. Kevin Oktavian, Sp.KJ", spec: "Psikiater & Terapi Trauma (PTSD)", license: "STR: 31112022099911", exp: "11 Tahun", rating: "4.9", reviews: "130", status: "online", price: "Rp 280.000", photo: "👨‍⚕️" },
                    { name: "Larasati Putri, M.Psi., Psikolog", spec: "Psikolog Anak, Remaja & Parenting", license: "SIPP: 2022048877 / HIMPSI", exp: "6 Tahun", rating: "4.8", reviews: "188", status: "busy", price: "Rp 180.000", photo: "🧠" },
                    { name: "Hendra Gunawan, M.Psi., Psikolog", spec: "Konselor Pernikahan & Relasi", license: "SIPP: 2021087722 / HIMPSI", exp: "13 Tahun", rating: "4.9", reviews: "164", status: "online", price: "Rp 220.000", photo: "🧠" },
                    { name: "Amelia Damayanti, M.Psi., Psikolog", spec: "Manajemen Stres Kerja & Burnout", license: "SIPP: 2024031155 / HIMPSI", exp: "5 Tahun", rating: "4.8", reviews: "92", status: "online", price: "Rp 160.000", photo: "🧠" }
                ]
            }
        };

        let currentDomain = 'medis';

        function switchDomain(domain) {
            currentDomain = domain;
            
            // Update tabs
            document.querySelectorAll('.domain-tab').forEach(el => {
                el.className = 'domain-tab';
            });
            document.getElementById(`tab-${domain}`).classList.add(`active-${domain}`);

            // Update pills
            const pillsContainer = document.getElementById('pills-container');
            pillsContainer.innerHTML = '';
            domainData[domain].pills.forEach((pill, idx) => {
                const span = document.createElement('span');
                span.className = `pill ${idx === 0 ? 'active' : ''}`;
                span.innerText = pill;
                span.onclick = () => {
                    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
                    span.classList.add('active');
                };
                pillsContainer.appendChild(span);
            });

            // Update partner cards
            const gridContainer = document.getElementById('grid-container');
            gridContainer.innerHTML = '';
            const btnClass = domainData[domain].btnClass;

            domainData[domain].partners.forEach(partner => {
                const statusClass = partner.status === 'online' ? 'status-online' : (partner.status === 'busy' ? 'status-busy' : 'status-offline');
                const dotClass = partner.status === 'online' ? 'dot-online' : (partner.status === 'busy' ? 'dot-busy' : 'dot-offline');
                const statusText = partner.status === 'online' ? '🟢 Online' : (partner.status === 'busy' ? '🟡 Sedang Konsul' : '🔴 Offline');
                
                const card = document.createElement('div');
                card.className = 'partner-card';
                card.innerHTML = `
                    <div class="${statusClass}">
                        <div class="dot ${dotClass}"></div> ${statusText}
                    </div>
                    <div>
                        <div class="partner-header">
                            <div class="partner-photo" style="display:flex; align-items:center; justify-content:center; font-size:2.2rem;">${partner.photo}</div>
                            <div class="partner-info">
                                <h3>${partner.name} <span class="badge-verified">✔ VERIFIED</span></h3>
                                <div class="spec">${partner.spec}</div>
                                <div class="license">${partner.license}</div>
                            </div>
                        </div>
                        <div class="partner-stats">
                            <div class="stat-item"><div class="stat-val">⭐️ ${partner.rating}</div><div class="stat-lbl">${partner.reviews} Ulasan</div></div>
                            <div class="stat-item"><div class="stat-val">⏳ ${partner.exp}</div><div class="stat-lbl">Pengalaman</div></div>
                            <div class="stat-item"><div class="stat-val">💬 100%</div><div class="stat-lbl">Respon Cepat</div></div>
                        </div>
                        <div class="partner-price">
                            <span class="price-label">Tarif Sesi Tele-Konsultasi (45 Menit):</span>
                            <span class="price-amount">${partner.price}</span>
                        </div>
                    </div>
                    <div>
                        <a href="mockup_payment_gateway.html?partner=${encodeURIComponent(partner.name)}&price=${encodeURIComponent(partner.price)}&domain=${domain}" class="btn-action ${btnClass}">
                            💬 Pilih & Lanjut Bayar (UC-05)
                        </a>
                        ${partner.status === 'online' ? `
                        <button class="btn-action btn-secondary" onclick="alert('📍 Memeriksa ketersediaan janji temu tatap muka RS/Kantor di radius < 10 km...')">
                            📅 Buat Janji Temu Offline (Faskes/Kantor)
                        </button>` : ''}
                    </div>
                `;
                gridContainer.appendChild(card);
            });
        }

        // Initialize on page load
        window.onload = () => {
            // Check URL parameters for initial domain selection
            const urlParams = new URLSearchParams(window.location.search);
            const domainParam = urlParams.get('domain');
            if (domainParam && ['medis', 'hukum', 'psikologi'].includes(domainParam)) {
                switchDomain(domainParam);
            } else {
                switchDomain('medis');
            }
        };
    </script>
</body>
</html>
