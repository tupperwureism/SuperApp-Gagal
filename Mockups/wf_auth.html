<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe - Auth</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: monospace; color: #333; }
        body { background-color: #f0f0f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .wf-container { width: 1000px; height: 600px; border: 2px solid #666; background-color: #fff; display: flex; }
        .wf-left { flex: 1; border-right: 2px solid #666; background-color: #e0e0e0; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px; text-align: center; }
        .wf-right { flex: 1; padding: 40px; display: flex; flex-direction: column; }
        
        .wf-box { border: 2px dashed #999; background-color: #eee; display: flex; align-items: center; justify-content: center; }
        
        /* Left Hero */
        .wf-logo { width: 200px; height: 60px; margin-bottom: 20px; }
        .wf-text-block { width: 80%; height: 80px; margin-bottom: 20px; }
        .wf-illustration { width: 250px; height: 250px; border-radius: 50%; }
        
        /* Right Auth Form */
        .wf-tabs { display: flex; gap: 10px; margin-bottom: 30px; }
        .wf-tab { flex: 1; height: 40px; background-color: #ccc; cursor: pointer; }
        .wf-tab.active { background-color: #999; font-weight: bold; color: white; border: 2px solid #666; }
        
        .wf-form-group { margin-bottom: 20px; }
        .wf-label { width: 100px; height: 15px; background-color: #bbb; margin-bottom: 5px; }
        .wf-input { width: 100%; height: 45px; }
        
        .wf-mitra-upload { width: 100%; height: 80px; margin-bottom: 20px; flex-direction: column; }
        
        .wf-button { width: 100%; height: 50px; background-color: #666; color: white; margin-top: 10px; }
        
        .wf-switch-link { width: 200px; height: 15px; background-color: #ccc; margin: 20px auto 0; }
    </style>
</head>
<body>
    <div class="wf-container">
        <!-- Banner Info (Left) -->
        <div class="wf-left">
            <div class="wf-box wf-logo">[Logo Qualifa / Justifiqa]</div>
            <div class="wf-box wf-text-block">[Teks: Akses Layanan Hukum, Medis, & Psikologi dalam 1 Platform]</div>
            <div class="wf-box wf-illustration">[Ilustrasi / Vektor]</div>
        </div>

        <!-- Form Area (Right) -->
        <div class="wf-right">
            <!-- Tabs (UC-01/02 vs UC-07/08) -->
            <div class="wf-tabs">
                <div class="wf-box wf-tab active">Masuk Sebagai Klien</div>
                <div class="wf-box wf-tab">Masuk Sebagai Mitra</div>
            </div>

            <!-- Formulir -->
            <div class="wf-form-group">
                <div class="wf-box wf-label"></div>
                <div class="wf-box wf-input">[Input: Email / No. HP]</div>
            </div>
            
            <div class="wf-form-group">
                <div class="wf-box wf-label"></div>
                <div class="wf-box wf-input">[Input: Password / OTP]</div>
            </div>

            <!-- Upload Box (Hanya terlihat jika tab Mitra + Mode Registrasi aktif) -->
            <div class="wf-box wf-mitra-upload">
                <div>[Ikon Upload]</div>
                <div>[Upload Dokumen Lisensi (STR / Peradi) - Khusus Mitra]</div>
            </div>

            <button class="wf-box wf-button">[TOMBOL LOGIN / REGISTER]</button>

            <div class="wf-box wf-switch-link"></div>
        </div>
    </div>
</body>
</html>
